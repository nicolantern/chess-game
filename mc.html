<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8ec5ff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%8F%3C/text%3E%3C/svg%3E"
    />
    <title>Voxel World</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #8ec5ff; }
      #scene { display: block; width: 100vw; height: 100vh; }
      #hurtflash { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .12s;
        background: radial-gradient(ellipse at center, rgba(180,0,0,0) 45%, rgba(180,0,0,.85) 100%); }
      #crosshair {
        position: fixed; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, -50%);
        width: 26px; height: 26px; pointer-events: none; mix-blend-mode: difference;
      }
      /* White lines under "difference" invert against whatever's behind them. */
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
      #crosshair::before { left: 11px; top: 0; width: 4px; height: 26px; }
      #crosshair::after { top: 11px; left: 0; height: 4px; width: 26px; }
      #fps { position: fixed; right: 14px; top: 12px; z-index: 5; font: 600 13px system-ui; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
      #back {
        position: fixed; left: 14px; top: 12px; z-index: 6;
        font: 600 13px system-ui; color: #14181f; background: rgba(255,255,255,.85);
        border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none;
      }
      #hud { position: fixed; left: 14px; bottom: 64px; z-index: 5; font: 13px/1.5 system-ui; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
      #hud b { color: #ffe27a; }
      #hotbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; display: flex; gap: 6px; }
      .slot {
        width: 46px; height: 46px; border-radius: 6px; border: 3px solid rgba(0,0,0,.35);
        position: relative; box-shadow: inset 0 0 0 2px rgba(255,255,255,.15);
      }
      .slot.on { border-color: #fff; box-shadow: 0 0 0 2px #ffe27a; }
      .slot.empty { filter: grayscale(.75) brightness(.55); }
      .slot .key { position: absolute; left: 3px; top: 0; font: 700 10px system-ui; color: #fff; opacity: .65; text-shadow: 0 1px 2px #000; }
      .slot .count { position: absolute; right: 3px; bottom: 0; font: 800 15px system-ui; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
      .slot.empty .count { color: #cfcfcf; }

      /* Survival stats: health + hunger rows over an XP bar, above the hotbar. */
      #stats { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); width: 372px; z-index: 5; }
      #stats .row { display: flex; justify-content: space-between; margin-bottom: 3px; }
      #health, #hunger { display: flex; gap: 1px; }
      #hunger { flex-direction: row-reverse; }
      .hp, .fd { font-size: 16px; line-height: 1; text-shadow: 0 1px 2px #000; }
      .hp.full { color: #ff3b4e; }
      .hp.empty { color: #571d23; }
      .hp.half { background: linear-gradient(90deg, #ff3b4e 50%, #571d23 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .fd.empty { filter: grayscale(1) brightness(.55); opacity: .6; }
      #xp { position: relative; height: 9px; background: #2b2b2b; border: 1px solid #000; border-radius: 2px; }
      #xpfill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#9bf05a, #5fce2f); border-radius: 2px; }
      #xplevel { position: absolute; left: 50%; top: -17px; transform: translateX(-50%); color: #8ef04a; font: 800 14px system-ui; text-shadow: 0 0 3px #000, 0 1px 2px #000; }

      /* Inventory GUI */
      #inv { position: fixed; inset: 0; z-index: 12; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); }
      #inv.show { display: flex; }
      .inv-panel { background: #c6c6c6; border: 4px solid #565656; border-radius: 6px; padding: 14px 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
      .inv-title { font: 700 14px system-ui; color: #3a3a3a; margin-bottom: 10px; }
      .inv-main, .inv-hot { display: grid; grid-template-columns: repeat(9, 42px); gap: 4px; }
      .inv-hot { margin-top: 12px; }
      .inv-panel .slot { width: 42px; height: 42px; border: 2px solid #8a8a8a; background: #8b8b8b; border-radius: 3px; box-shadow: inset 2px 2px 0 rgba(255,255,255,.25), inset -2px -2px 0 rgba(0,0,0,.2); }
      .inv-panel .slot.on { outline: 2px solid #ffe27a; }
      .inv-top { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
      .inv-craft { display: grid; grid-template-columns: repeat(3, 42px); gap: 4px; }
      .inv-result .slot, .inv-craft .slot { position: relative; }
      .inv-arrow { font: 700 26px system-ui; color: #565656; padding-bottom: 8px; }
      .slot .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 23px; }
      .slot .durbar { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; background: #2b2b2b; border-radius: 2px; }
      .slot .durbar span { display: block; height: 100%; border-radius: 2px; }
      #cursoritem { position: fixed; z-index: 13; width: 40px; height: 40px; margin: -20px 0 0 -20px; pointer-events: none; display: none; border-radius: 3px; }
      #cursoritem .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 23px; }
      #cursoritem .count { position: absolute; right: 2px; bottom: -2px; font: 800 13px system-ui; color: #fff; text-shadow: 0 1px 2px #000; }

      /* Furnace GUI */
      #furnace { position: fixed; inset: 0; z-index: 12; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); }
      #furnace.show { display: flex; }
      #furnace .slot { position: relative; }
      .furnace-body { display: flex; align-items: center; gap: 18px; padding: 6px 4px; }
      .furnace-left { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .f-flame { font-size: 22px; line-height: 1; transition: opacity .1s; }
      .f-progress { width: 90px; height: 12px; background: #2b2b2b; border: 1px solid #000; border-radius: 3px; position: relative; }
      .f-progress > span { position: absolute; inset: 0; width: 0; background: linear-gradient(#ffd36a, #ff9a2e); border-radius: 3px; }

      /* Death screen */
      #killscreen { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column;
        align-items: center; justify-content: center; background: rgba(90,0,0,.55); backdrop-filter: blur(2px); }
      #killscreen.show { display: flex; }
      #killscreen h1 { font: 800 64px system-ui, sans-serif; color: #d63b3b; text-shadow: 0 4px 16px rgba(0,0,0,.7); margin-bottom: 6px; letter-spacing: 1px; }
      #death-sub { font: 500 20px system-ui; color: #f0dede; margin-bottom: 26px; text-shadow: 0 2px 6px rgba(0,0,0,.6); line-height: 1.7; }
      .death-lvl { font-size: 14px; opacity: .7; }
      #respawn { font: 700 18px system-ui; color: #14181f; background: #e7e7e7; border: 0; border-radius: 8px;
        padding: 12px 30px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
      #respawn:hover { background: #fff; }
      #overlay {
        position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: rgba(10,20,30,.35); cursor: pointer; font: 600 20px system-ui; color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,.5); transition: opacity .2s;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay small { display: block; margin-top: 8px; font-weight: 400; font-size: 14px; opacity: .9; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hurtflash"></div>
    <a id="back" href="./index.html">← Chess</a>
    <div id="fps">–– fps</div>
    <div id="crosshair"></div>
    <div id="hud">
      <b>WASD</b> move · <b>Mouse</b> look · <b>Space</b> jump · <b>Shift</b> sprint · <b>Hold L-click</b> mine · <b>R-click</b> place · <b>1–9 / scroll</b> select · <b>E</b> inventory · <b>Esc</b> release
    </div>
    <div id="stats">
      <div class="row"><div id="health"></div><div id="hunger"></div></div>
      <div id="xp"><div id="xpfill"></div><div id="xplevel"></div></div>
    </div>
    <div id="hotbar"></div>
    <div id="inv">
      <div class="inv-panel">
        <div class="inv-top">
          <div><div class="inv-title">Crafting (3×3)</div><div class="inv-craft"></div></div>
          <div class="inv-arrow">→</div>
          <div><div class="inv-title">&nbsp;</div><div class="inv-result"></div></div>
        </div>
        <div class="inv-title">Inventory</div>
        <div class="inv-main"></div>
        <div class="inv-hot"></div>
      </div>
    </div>
    <div id="furnace">
      <div class="inv-panel">
        <div class="inv-title">Furnace</div>
        <div class="furnace-body">
          <div class="furnace-left">
            <div class="f-in"></div>
            <div class="f-flame">🔥</div>
            <div class="f-fuel"></div>
          </div>
          <div class="f-progress"><span></span></div>
          <div class="f-out"></div>
        </div>
      </div>
    </div>
    <div id="cursoritem"></div>
    <div id="overlay">Click to play<small>WASD move · mouse look · left-click mine · right-click place · E for inventory</small></div>
    <div id="killscreen">
      <h1>You Died!</h1>
      <div id="death-sub"></div>
      <button id="respawn">Respawn</button>
    </div>
    <script type="module" src="/src/mc/main.js"></script>
  </body>
</html>
