<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd0ff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E"
    />
    <title>3D World</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #cfe8ff; }
      #scene { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 14px; bottom: 14px; z-index: 5;
        font: 13px/1.5 system-ui, sans-serif; color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
      }
      #hud b { color: #ffe27a; }
      #fps {
        position: fixed; right: 14px; top: 12px; z-index: 5;
        font: 600 13px system-ui; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6);
      }
      #back {
        position: fixed; left: 14px; top: 12px; z-index: 6;
        font: 600 13px system-ui; color: #14181f; background: rgba(255,255,255,.85);
        border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none;
      }
      #overlay {
        position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: rgba(10,20,30,.35); backdrop-filter: blur(2px); cursor: pointer;
        font: 600 20px system-ui; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5);
        transition: opacity .2s;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay small { display: block; margin-top: 8px; font-weight: 400; font-size: 14px; opacity: .9; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <a id="back" href="./index.html">← Chess</a>
    <div id="fps">–– fps</div>
    <div id="hud">
      <b>WASD</b> move · <b>Mouse</b> look · <b>Shift</b> sprint · <b>Space</b> jump · <b>Scroll</b> zoom · <b>Esc</b> release
    </div>
    <div id="overlay">Click to explore<small>WASD to move · mouse to look around</small></div>
    <script type="module" src="/src/world/main.js"></script>
  </body>
</html>
